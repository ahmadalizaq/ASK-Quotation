<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ASK & Quotation</title>

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700;800&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="authScreen" style="display: flex;">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark">A؟</div>
        <div class="logo-text">ASK <span>&Q</span></div>
      </div>
      <div class="auth-title" id="authTitle">تسجيل الدخول</div>
      <div class="auth-sub" id="authSub">أدخل بياناتك للمتابعة</div>
      <div class="auth-error" id="authError"></div>
      
      <div class="auth-field" id="nameField" style="display:none;">
        <label>الاسم</label>
        <input type="text" id="authName" placeholder="مثال: سارة">
      </div>
      <div class="auth-field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="authEmail" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label>كلمة المرور</label>

        <input type="password" id="authPassword" placeholder="6 أحرف على الأقل">
      </div>
      
      <button class="btn-primary" id="authSubmitBtn" onclick="submitAuth()">دخول</button>
      
      <div class="auth-switch" id="authSwitchLine">
        ليس لديك حساب؟ <a onclick="toggleAuthMode()">أنشئ حساباً جديداً</a>
      </div>
      
      <button class="btn-demo" onclick="enableDemoMode()">🚀 الدخول كزائر (وضع المعاينة)</button>
    </div>
  </div>

  <!-- واجهة الموبايل -->
  <div class="app-mobile" id="appMobile" style="display:none;">
    <div class="topbar">
      <div class="logo">
        <div class="logo-mark">A؟</div>
        <div class="logo-text">ASK <span>&Q</span></div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="nav-wrap">
      <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('questions')"><div class="ic">❓</div><div class="lb">الأسئلة</div></div>
        <div class="nav-item" onclick="switchTab('quotes')"><div class="ic">❝</div><div class="lb">الاقتباسات</div></div>
        <div class="nav-item" onclick="switchTab('confessions')"><div class="ic">🎭</div><div class="lb">الاعترافات</div></div>
        <div class="nav-item" onclick="switchTab('profile')"><div class="ic">👤</div><div class="lb">حسابي</div></div>
      </div>
    </div>
  </div>

  <!-- واجهة سطح المكتب -->
  <div class="app-desktop" id="appDesktop" style="display:none;">
    <div class="d-header">
      <div class="logo">
        <div class="logo-mark">A؟</div>
        <div class="logo-text">ASK <span>&Q</span></div>
      </div>
      <div class="d-header-actions">
        <div class="d-coin-chip">🪙 <span id="dCoinCount">0</span></div>
      </div>
    </div>
    <div class="d-body">
      <aside class="d-sidebar-left">
        <div class="d-nav-item active" onclick="switchTab('questions')"><span class="ic">❓</span> الأسئلة</div>
        <div class="d-nav-item" onclick="switchTab('quotes')"><span class="ic">❝</span> الاقتباسات</div>
        <div class="d-nav-item" onclick="switchTab('confessions')"><span class="ic">🎭</span> الاعترافات</div>
        <div class="d-nav-item" onclick="switchTab('profile')"><span class="ic">👤</span> حسابي</div>
      </aside>
      <main class="d-main" id="desktopContent"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- الترتيب الصحيح وجميع الملفات استدعيت أونلاين -->
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
